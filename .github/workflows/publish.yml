name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, with or without v prefix (for example, v0.3.23)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PACKAGE_NAME: '@kushagradhawan/kookie-ui'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: the next step installs npm@latest for trusted
          # publishing, and current npm refuses to install on Node 20.
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"
            echo "Use a semver tag like v0.3.23 or v0.3.23-beta.1"
            exit 1
          fi

          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version from tag
        working-directory: packages/kookie-ui
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build package
        run: pnpm --filter @kushagradhawan/kookie-ui build

      - name: Check if version exists on npm
        id: check_version
        working-directory: packages/kookie-ui
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking if $PACKAGE_NAME@$VERSION exists on npm..."
          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already exists on npm"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION does not exist on npm - proceeding with publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.exists == 'false'
        working-directory: packages/kookie-ui
        run: npm publish --access public
