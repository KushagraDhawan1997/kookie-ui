name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, with or without v prefix (for example, v0.3.23)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PACKAGE_NAME: '@kushagradhawan/kookie-ui'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: the next step installs npm@latest for trusted
          # publishing, and current npm refuses to install on Node 20.
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${VERSION#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"
            echo "Use a semver tag like v0.3.23 or v0.3.23-beta.1"
            exit 1
          fi

          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One release record: the tag, package.json and npm agree, and versions only go up.
      - name: Check the release is tagged, recorded and newer
        working-directory: packages/kookie-ui
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "No tag v$VERSION. Tag the release commit first; every publish has a tag."
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json says $PKG_VERSION but the release is $VERSION. Bump package.json in the release commit."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION."
            exit 1
          fi
          LATEST=$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || echo 0.0.0)
          node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split("-")[0].split(".").map(Number));
            for (let i = 0; i < 3; i++) { if (a[i] > b[i]) process.exit(0); if (a[i] < b[i]) break; }
            if (process.argv[1] === process.argv[2]) process.exit(0);
            console.error("Version " + process.argv[1] + " is not above npm latest " + process.argv[2] + ".");
            process.exit(1);
          ' "$VERSION" "$LATEST"

      - name: Install Chromium for browser tests
        run: pnpm --filter @kushagradhawan/kookie-ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter @kushagradhawan/kookie-ui test

      - name: Build package
        run: pnpm --filter @kushagradhawan/kookie-ui build

      - name: Check if version exists on npm
        id: check_version
        working-directory: packages/kookie-ui
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking if $PACKAGE_NAME@$VERSION exists on npm..."
          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already exists on npm"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION does not exist on npm - proceeding with publish"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.exists == 'false'
        working-directory: packages/kookie-ui
        run: npm publish --access public
