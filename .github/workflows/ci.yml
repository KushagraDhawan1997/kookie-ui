name: CI

# The publish workflow ships to npm from a `v*` tag, and the only check it runs
# on the way is `prepublishOnly`, which is lint. Nothing runs the test suite.
# This is the gate that does, so a change is checked before it can be tagged and
# published rather than after.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the version from the root packageManager field, so CI cannot
      # drift from what contributors run locally.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # eslint, stylelint and tsc --noEmit. Same command prepublishOnly runs.
      - name: Lint
        run: pnpm --filter @kushagradhawan/kookie-ui lint

      # The browser test project mounts components in real Chromium through Playwright.
      - name: Install Chromium for browser tests
        run: pnpm --filter @kushagradhawan/kookie-ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter @kushagradhawan/kookie-ui test

      # The publish workflow builds before publishing, so a build that fails
      # here would otherwise fail during a release, after the tag is cut.
      - name: Build
        run: pnpm build:pkg

      # tsd over the emitted declarations, so the public prop types are
      # checked as consumers see them. tsd rewrites `moduleResolution` to the
      # legacy `node` resolver unless `module` is node16 or nodenext, which
      # cannot read radix-ui's exports map, hence `tsd.compilerOptions` in
      # package.json and the ESM-scoped tests/types/package.json.
      - name: Type tests
        run: pnpm --filter @kushagradhawan/kookie-ui test:types

      # Five heavy screens from apps/bench, measured in Chromium against apps/bench/budget.json.
      # Counts fail on any increase; times fail past their margin once recorded from CI.
      - name: Performance budget
        run: pnpm --filter bench bench
